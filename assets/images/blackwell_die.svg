<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" aria-label="NVIDIA Blackwell Architecture Diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="nvGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76B900"/>
      <stop offset="100%" stop-color="#4B7700"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.4"/>

  <!-- Substrate / Package Boundary -->
  <rect x="100" y="50" width="600" height="400" rx="8" fill="#181818" stroke="#333" stroke-width="2"/>
  <rect x="108" y="58" width="584" height="384" rx="6" fill="#111" stroke="#222"/>

  <!-- Left Blackwell Die (104B Transistors) -->
  <rect x="170" y="110" width="210" height="280" rx="4" fill="#1c1c1c" stroke="#444" stroke-width="1.5"/>
  <text x="275" y="140" fill="#76B900" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BLACKWELL DIE 0</text>
  <text x="275" y="158" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">104 Billion Transistors</text>

  <!-- Left SM / Tensor Matrix -->
  <g fill="#242424" stroke="#76B900" stroke-width="0.75" opacity="0.85">
    <rect x="185" y="175" width="85" height="45" rx="2"/>
    <rect x="280" y="175" width="85" height="45" rx="2"/>
    <rect x="185" y="230" width="85" height="45" rx="2"/>
    <rect x="280" y="230" width="85" height="45" rx="2"/>
    <rect x="185" y="285" width="85" height="45" rx="2"/>
    <rect x="280" y="285" width="85" height="45" rx="2"/>
    <rect x="185" y="340" width="180" height="35" rx="2" fill="#2a2a2a" stroke="#555"/>
  </g>
  <text x="227" y="202" fill="#eee" font-family="monospace" font-size="9" text-anchor="middle">TENSOR CORE</text>
  <text x="322" y="202" fill="#eee" font-family="monospace" font-size="9" text-anchor="middle">2ND GEN TR</text>
  <text x="275" y="362" fill="#76B900" font-family="monospace" font-size="10" text-anchor="middle">HIGH-BANDWIDTH CACHE</text>

  <!-- 10 TB/s NVLink-C2C High-Speed Interconnect Bridge -->
  <rect x="384" y="150" width="32" height="200" rx="3" fill="url(#nvGreenGrad)" stroke="#76B900" stroke-width="1"/>
  <text x="400" y="240" fill="#000" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 400 240)">10 TB/s NV-HBI</text>

  <!-- Right Blackwell Die (104B Transistors) -->
  <rect x="420" y="110" width="210" height="280" rx="4" fill="#1c1c1c" stroke="#444" stroke-width="1.5"/>
  <text x="525" y="140" fill="#76B900" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BLACKWELL DIE 1</text>
  <text x="525" y="158" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">104 Billion Transistors</text>

  <!-- Right SM / Tensor Matrix -->
  <g fill="#242424" stroke="#76B900" stroke-width="0.75" opacity="0.85">
    <rect x="435" y="175" width="85" height="45" rx="2"/>
    <rect x="530" y="175" width="85" height="45" rx="2"/>
    <rect x="435" y="230" width="85" height="45" rx="2"/>
    <rect x="530" y="230" width="85" height="45" rx="2"/>
    <rect x="435" y="285" width="85" height="45" rx="2"/>
    <rect x="530" y="285" width="85" height="45" rx="2"/>
    <rect x="435" y="340" width="180" height="35" rx="2" fill="#2a2a2a" stroke="#555"/>
  </g>
  <text x="477" y="202" fill="#eee" font-family="monospace" font-size="9" text-anchor="middle">TENSOR CORE</text>
  <text x="572" y="202" fill="#eee" font-family="monospace" font-size="9" text-anchor="middle">FP4 ENGINE</text>
  <text x="525" y="362" fill="#76B900" font-family="monospace" font-size="10" text-anchor="middle">HIGH-BANDWIDTH CACHE</text>

  <!-- HBM3e Stacks (8x 24GB = 192GB) -->
  <g fill="#2d2d2d" stroke="#555" stroke-width="1">
    <rect x="120" y="120" width="40" height="55" rx="2"/>
    <rect x="120" y="190" width="40" height="55" rx="2"/>
    <rect x="120" y="260" width="40" height="55" rx="2"/>
    <rect x="120" y="330" width="40" height="55" rx="2"/>

    <rect x="640" y="120" width="40" height="55" rx="2"/>
    <rect x="640" y="190" width="40" height="55" rx="2"/>
    <rect x="640" y="260" width="40" height="55" rx="2"/>
    <rect x="640" y="330" width="40" height="55" rx="2"/>
  </g>
  <text x="140" y="240" fill="#76B900" font-family="monospace" font-size="8" text-anchor="middle" transform="rotate(-90 140 240)">8x HBM3e</text>
  <text x="660" y="240" fill="#76B900" font-family="monospace" font-size="8" text-anchor="middle" transform="rotate(-90 660 240)">8 TB/s BANDWIDTH</text>

  <!-- Architecture Header Banner -->
  <rect x="100" y="50" width="600" height="40" rx="6" fill="#000000" stroke="#333"/>
  <text x="120" y="75" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="14" letter-spacing="1">NVIDIA BLACKWELL B200 ULTRA</text>
  <text x="680" y="75" fill="#76B900" font-family="monospace" font-size="11" text-anchor="end">208B TRANSISTORS / TSMC 4NP</text>
</svg>
