<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" aria-label="NVIDIA Quantum Accelerated Supercomputing">
  <rect width="100%" height="100%" fill="#090a0d"/>

  <rect x="70" y="40" width="660" height="420" rx="8" fill="#111317" stroke="#232730" stroke-width="2"/>
  <rect x="70" y="40" width="660" height="50" rx="6" fill="#0c0e12" stroke="#1c2029"/>
  <text x="100" y="72" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="15" letter-spacing="1">NVIDIA HYBRID QUANTUM-CLASSICAL SUPERCOMPUTING</text>
  <text x="700" y="72" fill="#76B900" font-family="monospace" font-size="11" text-anchor="end">CUDA-Q / cuQuantum / DGX QUANTUM</text>

  <!-- Split Architecture: GPU Accelerated Supercomputer <-> Quantum Processing Unit QPU -->
  <g transform="translate(100, 115)">
    <!-- GPU Cluster -->
    <rect x="0" y="0" width="270" height="230" rx="6" fill="#14171d" stroke="#76B900" stroke-width="1.5"/>
    <text x="135" y="30" fill="#76B900" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">NVIDIA DGX GPU SUPERCOMPUTER</text>
    <text x="135" y="55" fill="#888" font-family="sans-serif" font-size="10" text-anchor="middle">Classical Acceleration &amp; Simulation</text>

    <rect x="20" y="75" width="230" height="40" rx="3" fill="#1b2029" stroke="#333"/>
    <text x="135" y="100" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">cuQuantum Tensor Network</text>

    <rect x="20" y="125" width="230" height="40" rx="3" fill="#1b2029" stroke="#333"/>
    <text x="135" y="150" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">State Vector Simulation (cuStateVec)</text>

    <rect x="20" y="175" width="230" height="40" rx="3" fill="#1b2029" stroke="#333"/>
    <text x="135" y="200" fill="#76B900" font-family="monospace" font-size="10" text-anchor="middle">CUDA-Q Compiler &amp; Runtime</text>

    <!-- Interconnect Bridge -->
    <rect x="270" y="95" width="60" height="40" fill="#76B900" opacity="0.8"/>
    <text x="300" y="118" fill="#000" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">&lt; sub-μs &gt;</text>
    <text x="300" y="130" fill="#000" font-family="monospace" font-size="7" text-anchor="middle">PCIe / NVLink</text>

    <!-- QPU Unit -->
    <rect x="330" y="0" width="270" height="230" rx="6" fill="#14171d" stroke="#4488ff" stroke-width="1.5"/>
    <text x="465" y="30" fill="#4488ff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">QUANTUM PROCESSING UNIT (QPU)</text>
    <text x="465" y="55" fill="#888" font-family="sans-serif" font-size="10" text-anchor="middle">Superconducting / Neutral Atoms / Trapped-Ion</text>

    <rect x="350" y="75" width="230" height="40" rx="3" fill="#182030" stroke="#2a3a55"/>
    <text x="465" y="100" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">Quantum Error Correction (QEC)</text>

    <rect x="350" y="125" width="230" height="40" rx="3" fill="#182030" stroke="#2a3a55"/>
    <text x="465" y="150" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">Pulse-Level Control Calibration</text>

    <rect x="350" y="175" width="230" height="40" rx="3" fill="#182030" stroke="#2a3a55"/>
    <text x="465" y="200" fill="#4488ff" font-family="monospace" font-size="10" text-anchor="middle">Real-time Hybrid Feedback</text>
  </g>

  <!-- Bottom Explanatory Ribbon -->
  <rect x="100" y="365" width="600" height="70" rx="4" fill="#111317" stroke="#222"/>
  <text x="400" y="395" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">UNIFIED HYBRID PROGRAMMING WITH CUDA-Q</text>
  <text x="400" y="415" fill="#76B900" font-family="monospace" font-size="10" text-anchor="middle">Enables scientists to co-program CPUs, GPUs, and QPUs inside standard C++ and Python workflows.</text>
</svg>
